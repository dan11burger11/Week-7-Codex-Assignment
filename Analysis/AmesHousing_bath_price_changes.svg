<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#222}.small{font-size:13px}.label{font-size:14px}.title{font-size:22px;font-weight:bold}.subtitle{font-size:14px;fill:#555}</style>
<text x="90" y="30" class="title">Mean sale price change between adjacent half-bath groups</text>
<text x="90" y="52" class="subtitle">Percent change in group mean; observational comparison, not an adjusted causal effect</text>
<line x1="90" y1="415.0" x2="970" y2="415.0" stroke="#ddd"/>
<text x="78" y="420.0" text-anchor="end" class="small">0%</text>
